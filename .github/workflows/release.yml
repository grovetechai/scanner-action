name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          body_path: CHANGELOG.md
      - name: Move major tag (v1)
        run: |
          MAJOR="v$(echo '${{ steps.ver.outputs.version }}' | cut -d. -f1)"
          git config user.email "bot@grovetech.ai"
          git config user.name "grovetech-bot"
          git tag -f "$MAJOR"
          git push origin -f "$MAJOR"
