name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify dist/ is committed
        run: |
          if ! git diff --quiet dist/; then
            echo "::error::dist/ differs from committed bundle. Commit the rebuild before tagging."
            exit 1
          fi
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHANGELOG.md
      - name: Move major tag (v1)
        run: |
          MAJOR="v$(echo '${{ steps.ver.outputs.version }}' | cut -d. -f1)"
          git tag -f "$MAJOR"
          git push origin -f "$MAJOR"
