name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Warn if dist/index.js drifted
        run: |
          if ! git diff --quiet dist/index.js; then
            echo "::warning::dist/index.js differs from committed bundle. Run 'npm run build' locally and commit before tagging a release."
          fi
