name: Self-test

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-self:
    runs-on: ubuntu-latest
    env:
      HAS_VIBE_KEY: ${{ secrets.VIBE_API_KEY != '' }}
    steps:
      - if: env.HAS_VIBE_KEY != 'true'
        run: |
          echo "::notice::VIBE_API_KEY secret not set; skipping self-test."
      - if: env.HAS_VIBE_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_VIBE_KEY == 'true'
        name: Run scanner-action against this repo
        uses: ./
        with:
          api-key: ${{ secrets.VIBE_API_KEY }}
          severity-threshold: critical
          paths: |
            src/**/*.ts
            tests/**/*.ts
            action.yml
            package.json
