name: Self-test

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-self:
    runs-on: ubuntu-latest
    if: ${{ secrets.VIBE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner-action against this repo
        uses: ./
        with:
          api-key: ${{ secrets.VIBE_API_KEY }}
          severity-threshold: critical
          paths: |
            src/**/*.ts
            tests/**/*.ts
            action.yml
            package.json
